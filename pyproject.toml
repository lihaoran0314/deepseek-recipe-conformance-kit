[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-recipe-conformance-kit"
version = "0.1.0"
description = "Protocol conformance and stream chunk-splitting tests for deepseek-recipe"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DeepSeek Recipe Conformance contributors" }]
keywords = ["deepseek-recipe", "conformance", "streaming", "protocol", "testing"]
dependencies = []

[project.optional-dependencies]
official = ["deepseek-recipe==0.2.0"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
recipe-conformance = "recipe_conformance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
